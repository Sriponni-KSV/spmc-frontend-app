<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.audioRecorder = {
      mediaRecorder: null,
      audioChunks: [],
      
      startRecording: async function(callback) {
        this.audioChunks = [];
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          this.mediaRecorder = new MediaRecorder(stream);
          this.mediaRecorder.ondataavailable = (event) => {
            this.audioChunks.push(event.data);
          };
          this.mediaRecorder.start();
          if (callback) callback(true);
        } catch (e) {
          console.error("Error starting recording:", e);
          if (callback) callback(false);
        }
      },
      
      stopRecording: function(callback) {
        if (!this.mediaRecorder) {
          if (callback) callback("");
          return;
        }
        this.mediaRecorder.onstop = () => {
          const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64data = reader.result.split(',')[1];
            if (callback) callback(base64data);
          };
          reader.readAsDataURL(audioBlob);
          this.mediaRecorder.stream.getTracks().forEach(track => track.stop());
        };
        this.mediaRecorder.stop();
      }
    };
  </script>
  <script>
    // ─── WebGL Context Loss Auto-Recovery ────────────────────────────────
    // Flutter 3.22+ CanvasKit throws LateInitializationError when the browser
    // loses the WebGL context (happens on hot restart in dev mode).
    // This intercepts the event and auto-reloads the page to recover cleanly.
    (function () {
      var _patched = false;
      function patchCanvas(canvas) {
        if (!canvas || canvas.__ctxLossPatch) return;
        canvas.__ctxLossPatch = true;
        canvas.addEventListener('webglcontextlost', function (e) {
          e.preventDefault();
          console.warn('[Flutter] WebGL context lost — reloading page to recover…');
          setTimeout(function () { window.location.reload(); }, 300);
        }, false);
      }

      // Patch any canvas created after this script runs
      var _origGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, opts) {
        var ctx = _origGetContext.apply(this, arguments);
        if (type && type.startsWith('webgl')) patchCanvas(this);
        return ctx;
      };

      // Also watch for dynamically added canvases (CanvasKit creates them late)
      if (window.MutationObserver) {
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            m.addedNodes.forEach(function (node) {
              if (node.tagName === 'CANVAS') patchCanvas(node);
              if (node.querySelectorAll) {
                node.querySelectorAll('canvas').forEach(patchCanvas);
              }
            });
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
