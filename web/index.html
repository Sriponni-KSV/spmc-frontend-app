<body>
  <script>
    // Ensure Flutter Web syncs immediately when DevTools device mode is toggled
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        window.dispatchEvent(new Event('resize'));
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.speechRecognizer = {
      recognition: null,
      isUserListening: false,
      onResultCallback: null,
      onStatusCallback: null,
      onErrorCallback: null,
      accumulatedFinal: '',
      targetLang: 'en-US',

      isSupported: function() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      },

      start: function(onResult, onStatus, onError, lang) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          if (onError) onError("Speech recognition not supported in this browser");
          return false;
        }

        this.onResultCallback = onResult;
        this.onStatusCallback = onStatus;
        this.onErrorCallback = onError;
        this.isUserListening = true;
        this.accumulatedFinal = '';
        this.targetLang = lang || 'en-US';

        this._createAndStartRecognition();
        return true;
      },

      _createAndStartRecognition: function() {
        if (!this.isUserListening) return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (this.recognition) {
          try {
            this.recognition.onend = null;
            this.recognition.onerror = null;
            this.recognition.onresult = null;
            this.recognition.abort();
          } catch(e) {}
          this.recognition = null;
        }

        try {
          const rec = new SpeechRecognition();
          this.recognition = rec;
          rec.continuous = true;
          rec.interimResults = true;
          rec.maxAlternatives = 1;
          rec.lang = (this.targetLang && this.targetLang !== 'en-US') ? this.targetLang : (navigator.language || 'en-IN');

          rec.onstart = () => {
            if (this.onStatusCallback) this.onStatusCallback('listening');
          };

          rec.onresult = (event) => {
            let sessionText = '';
            for (let i = 0; i < event.results.length; ++i) {
              const piece = event.results[i][0].transcript.trim();
              if (piece.length > 0) {
                sessionText += (sessionText.length > 0 ? ' ' : '') + piece;
              }
            }
            this._lastSessionText = sessionText;
            const full = (this.accumulatedFinal + (sessionText.length > 0 ? (' ' + sessionText) : '')).trim();
            if (this.onResultCallback && full.length > 0) {
              this.onResultCallback(full);
            }
          };

          rec.onerror = (event) => {
            console.warn("Web Speech API recognition error:", event.error);
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
              if (this.onErrorCallback) this.onErrorCallback("Microphone permission denied or blocked. If using HTTP IP, please enable insecure origins flag in Chrome.");
            } else if (event.error === 'network') {
              if (this.onErrorCallback) this.onErrorCallback("Speech network error. Chrome requires HTTPS or chrome://flags insecure origin bypass for Web Speech.");
            } else if (event.error !== 'no-speech' && event.error !== 'audio-capture') {
              if (this.onErrorCallback) this.onErrorCallback("Speech error: " + event.error);
            }
          };

          rec.onend = () => {
            if (this.isUserListening) {
              if (this._lastSessionText && this._lastSessionText.trim().length > 0) {
                this.accumulatedFinal = (this.accumulatedFinal + ' ' + this._lastSessionText).trim();
                this._lastSessionText = '';
              }
              setTimeout(() => {
                if (this.isUserListening) {
                  this._createAndStartRecognition();
                }
              }, 150);
            } else {
              if (this.onStatusCallback) this.onStatusCallback('notListening');
            }
          };

          rec.start();
        } catch(err) {
          console.error("Failed to initialize Web Speech API:", err);
          if (this.onErrorCallback) this.onErrorCallback(err.toString());
        }
      },

      stop: function() {
        this.isUserListening = false;
        if (this.recognition) {
          try {
            this.recognition.stop();
          } catch(e) {}
        }
        if (this.onStatusCallback) this.onStatusCallback('notListening');
      },

      abort: function() {
        this.isUserListening = false;
        if (this.recognition) {
          try {
            this.recognition.abort();
          } catch(e) {}
        }
        if (this.onStatusCallback) this.onStatusCallback('notListening');
      }
    };

    // ─── Global Unsaved Form Data Reload Protection ──────────────────────────
    window.unsavedChanges = {
      hasUnsavedData: false,
      setHasUnsavedData: function(flag) {
        this.hasUnsavedData = !!flag;
      },
      reset: function() {
        this.hasUnsavedData = false;
      }
    };

    // Automatically detect user typing in ANY form input/textarea/editable field across the app
    document.addEventListener('input', function (e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) {
        var val = e.target.value || e.target.innerText || '';
        if (val.trim().length > 0) {
          window.unsavedChanges.hasUnsavedData = true;
        }
      }
    }, true);

    document.addEventListener('change', function (e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
        window.unsavedChanges.hasUnsavedData = true;
      }
    }, true);

    window.addEventListener('beforeunload', function (e) {
      if (window.unsavedChanges && window.unsavedChanges.hasUnsavedData) {
        e.preventDefault();
        e.returnValue = 'Do you want to refresh? All unsaved data will be lost.';
        return 'Do you want to refresh? All unsaved data will be lost.';
      }
    });
  </script>
  <script>
    // ─── Flutter CanvasKit Hot-Restart Fix ───────────────────────────────────
    // Root cause: During hot restart Flutter's compiled JS still holds a
    // reference to a Dart "Surface" object whose late field
    // _handledContextLostEvent has not yet been initialized in the new isolate.
    // When the browser fires webglcontextlost the old JS callback tries to
    // access that field and throws LateInitializationError.
    //
    // Solution: Override EventTarget.prototype.addEventListener so that every
    // webglcontextlost listener Flutter registers is automatically wrapped in a
    // try-catch. If the Dart error surfaces at the JS boundary we catch it and
    // do a clean page reload instead of crashing.
    // ─────────────────────────────────────────────────────────────────────────
    (function () {
      var _origAdd = EventTarget.prototype.addEventListener;

      EventTarget.prototype.addEventListener = function (type, listener, options) {
        if (type === 'webglcontextlost' && typeof listener === 'function') {
          var _dart = listener;
          listener = function (e) {
            try {
              return _dart.call(this, e);
            } catch (err) {
              if (String(err).indexOf('_handledContextLostEvent') !== -1) {
                console.warn('[Flutter] Caught _handledContextLostEvent in webglcontextlost handler — reloading…');
                e.preventDefault();
                setTimeout(function () { window.location.reload(); }, 50);
              } else {
                throw err;
              }
            }
          };
        }
        return _origAdd.call(this, type, listener, options);
      };

      // Belt-and-suspenders: also catch at the window error level in case
      // Flutter dispatches via a non-addEventListener path.
      window.addEventListener('error', function (e) {
        if (e && e.message &&
            e.message.indexOf('_handledContextLostEvent') !== -1) {
          e.preventDefault();
          console.warn('[Flutter] Global catch of _handledContextLostEvent — reloading…');
          window.location.reload();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason &&
            String(e.reason).indexOf('_handledContextLostEvent') !== -1) {
          e.preventDefault();
          console.warn('[Flutter] Unhandled rejection of _handledContextLostEvent — reloading…');
          window.location.reload();
        }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
