<html>
<head>

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Sri Ponni Medical Center">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sri_ponni">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sri_ponni</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    // Ensure Flutter Web syncs immediately when DevTools device mode is toggled
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        window.dispatchEvent(new Event('resize'));
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.speechRecognizer = {
      _isV2: true,
      recognition: null,
      isUserListening: false,
      isReady: true,
      onResultCallback: null,
      onStatusCallback: null,
      onErrorCallback: null,
      accumulatedFinal: '',
      sessionFinal: '',
      targetLang: 'en-IN',
      _restartTimer: null,
      _retryTimer: null,

      isSupported: function() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      },

      start: function(onResult, onStatus, onError, lang) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          if (onError) onError("Web Speech API is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
          return false;
        }

        if (this._restartTimer) {
          clearTimeout(this._restartTimer);
          this._restartTimer = null;
        }
        if (this._retryTimer) {
          clearTimeout(this._retryTimer);
          this._retryTimer = null;
        }

        this.onResultCallback = onResult;
        this.onStatusCallback = onStatus;
        this.onErrorCallback = onError;
        this.isUserListening = true;
        this.accumulatedFinal = '';
        this.sessionFinal = '';
        this.targetLang = (lang && lang.trim()) ? lang.trim() : 'en-IN';

        this._stopCurrentRecognition();
        this._safeStart(0);
        return true;
      },

      _stopCurrentRecognition: function() {
        if (this.recognition) {
          const oldRec = this.recognition;
          this.recognition = null;
          oldRec.onstart = null;
          oldRec.onresult = null;
          oldRec.onerror = null;
          oldRec.onend = null;
          try {
            oldRec.abort();
          } catch(e) {}
        }
      },

      _safeStart: function(attempt) {
        if (!this.isUserListening) return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        this._stopCurrentRecognition();

        try {
          const rec = new SpeechRecognition();
          this.recognition = rec;
          rec.continuous = true;
          rec.interimResults = true;
          rec.maxAlternatives = 1;
          rec.lang = this.targetLang || 'en-IN';

          rec.onstart = () => {
            if (this.isUserListening && this.onStatusCallback) {
              this.onStatusCallback('listening');
            }
          };

          rec.onresult = (event) => {
            if (!this.isUserListening) return;
            let finalChunk = '';
            let interimChunk = '';

            for (let i = 0; i < event.results.length; ++i) {
              const item = event.results[i];
              if (item && item[0] && item[0].transcript) {
                const text = item[0].transcript.trim();
                if (item.isFinal) {
                  finalChunk += (finalChunk ? ' ' : '') + text;
                } else {
                  interimChunk += (interimChunk ? ' ' : '') + text;
                }
              }
            }

            this.sessionFinal = finalChunk;
            const livePart = interimChunk || finalChunk;
            let full = this.accumulatedFinal;
            if (livePart) {
              full = (full ? full + ' ' : '') + livePart;
            }

            if (this.onResultCallback && full.trim().length > 0) {
              this.onResultCallback(full.trim());
            }
          };

          rec.onerror = (event) => {
            if (!this.isUserListening) return;
            const err = event.error;

            if (err === 'no-speech' || err === 'aborted') {
              return;
            }

            this.isUserListening = false;
            this._stopCurrentRecognition();

            if (err === 'not-allowed' || err === 'service-not-allowed') {
              if (this.onErrorCallback) this.onErrorCallback("Microphone permission denied. Please allow microphone access in your browser address bar.");
              if (this.onStatusCallback) this.onStatusCallback('notListening');
            } else if (err === 'audio-capture') {
              if (this.onErrorCallback) this.onErrorCallback("No microphone found or microphone is in use by another application.");
              if (this.onStatusCallback) this.onStatusCallback('notListening');
            } else if (err === 'network') {
              if (this.onErrorCallback) this.onErrorCallback("Network error during speech recognition. Please check your internet connection.");
              if (this.onStatusCallback) this.onStatusCallback('notListening');
            } else {
              console.warn("Speech error:", err);
              if (this.onErrorCallback) this.onErrorCallback("Speech error: " + err);
              if (this.onStatusCallback) this.onStatusCallback('notListening');
            }
          };

          rec.onend = () => {
            if (this.recognition !== rec) return;

            if (this.isUserListening) {
              if (this.sessionFinal) {
                this.accumulatedFinal = (this.accumulatedFinal ? this.accumulatedFinal + ' ' : '') + this.sessionFinal;
                this.sessionFinal = '';
              }
              clearTimeout(this._restartTimer);
              this._restartTimer = setTimeout(() => {
                if (this.isUserListening) {
                  this._safeStart(0);
                }
              }, 100);
            } else {
              this.recognition = null;
              if (this.onStatusCallback) this.onStatusCallback('notListening');
            }
          };

          rec.start();
        } catch(err) {
          const errStr = (err && err.message) ? err.message : String(err);
          console.warn("Speech start exception (attempt " + attempt + "):", errStr);

          if (attempt < 5 && this.isUserListening && (
            errStr.includes('already started') ||
            errStr.includes('InvalidStateError') ||
            errStr.includes('busy') ||
            errStr.includes('failed')
          )) {
            clearTimeout(this._retryTimer);
            this._retryTimer = setTimeout(() => {
              if (this.isUserListening) {
                this._safeStart(attempt + 1);
              }
            }, 120 + (attempt * 80));
            return;
          }

          this.isUserListening = false;
          this._stopCurrentRecognition();
          if (this.onErrorCallback) this.onErrorCallback(errStr);
          if (this.onStatusCallback) this.onStatusCallback('notListening');
        }
      },

      stop: function() {
        this.isUserListening = false;
        if (this._restartTimer) {
          clearTimeout(this._restartTimer);
          this._restartTimer = null;
        }
        if (this._retryTimer) {
          clearTimeout(this._retryTimer);
          this._retryTimer = null;
        }
        if (this.sessionFinal) {
          this.accumulatedFinal = (this.accumulatedFinal ? this.accumulatedFinal + ' ' : '') + this.sessionFinal;
          this.sessionFinal = '';
        }
        this._stopCurrentRecognition();
        if (this.onStatusCallback) {
          try { this.onStatusCallback('notListening'); } catch(e) {}
        }
      },

      abort: function() {
        this.isUserListening = false;
        if (this._restartTimer) {
          clearTimeout(this._restartTimer);
          this._restartTimer = null;
        }
        if (this._retryTimer) {
          clearTimeout(this._retryTimer);
          this._retryTimer = null;
        }
        this.accumulatedFinal = '';
        this.sessionFinal = '';
        this._stopCurrentRecognition();
        if (this.onStatusCallback) {
          try { this.onStatusCallback('notListening'); } catch(e) {}
        }
      }
    };

    // ─── Global Unsaved Form Data Reload Protection ──────────────────────────
    window.unsavedChanges = {
      hasUnsavedData: false,

      setHasUnsavedData: function(flag) {
        this.hasUnsavedData = !!flag;
      },

      reset: function() {
        this.hasUnsavedData = false;
      }
    };

    window.addEventListener('beforeunload', function (e) {
      if (window.unsavedChanges && window.unsavedChanges.hasUnsavedData) {
        e.preventDefault();
        e.returnValue = 'Do you want to refresh? All unsaved data will be lost.';
        return 'Do you want to refresh? All unsaved data will be lost.';
      }
    });
  </script>
  <script>
    // ─── Flutter CanvasKit Hot-Restart Fix ───────────────────────────────────
    // Root cause: During hot restart Flutter's compiled JS still holds a
    // reference to a Dart "Surface" object whose late field
    // _handledContextLostEvent has not yet been initialized in the new isolate.
    // When the browser fires webglcontextlost the old JS callback tries to
    // access that field and throws LateInitializationError.
    //
    // Solution: Override EventTarget.prototype.addEventListener so that every
    // webglcontextlost listener Flutter registers is automatically wrapped in a
    // try-catch. If the Dart error surfaces at the JS boundary we catch it and
    // do a clean page reload instead of crashing.
    // ─────────────────────────────────────────────────────────────────────────
    (function () {
      var _origAdd = EventTarget.prototype.addEventListener;

      EventTarget.prototype.addEventListener = function (type, listener, options) {
        if (type === 'webglcontextlost' && typeof listener === 'function') {
          var _dart = listener;
          listener = function (e) {
            try {
              return _dart.call(this, e);
            } catch (err) {
              if (String(err).indexOf('_handledContextLostEvent') !== -1) {
                console.warn('[Flutter] Caught _handledContextLostEvent in webglcontextlost handler — reloading…');
                e.preventDefault();
                setTimeout(function () { window.location.reload(); }, 50);
              } else {
                throw err;
              }
            }
          };
        }
        return _origAdd.call(this, type, listener, options);
      };

      // Belt-and-suspenders: also catch at the window error level in case
      // Flutter dispatches via a non-addEventListener path.
      window.addEventListener('error', function (e) {
        if (e && e.message &&
            e.message.indexOf('_handledContextLostEvent') !== -1) {
          e.preventDefault();
          console.warn('[Flutter] Global catch of _handledContextLostEvent — reloading…');
          window.location.reload();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason &&
            String(e.reason).indexOf('_handledContextLostEvent') !== -1) {
          e.preventDefault();
          console.warn('[Flutter] Unhandled rejection of _handledContextLostEvent — reloading…');
          window.location.reload();
        }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
